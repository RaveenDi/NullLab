[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nulllab"
version = "0.2.0"
description = "Falsification harness for ML evaluation claims: finds leakage that inflates a reported metric, with a preregistered, replayable verdict."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
nulllab = "agent.engine:main"

[tool.setuptools.package-data]
app = ["static/*", "static/fonts/*"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["agent", "app", "baselines", "sandbox"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: takes more than 60 seconds on a laptop (deselect with -m 'not slow')",
    "live: calls the Meta Model API and spends money; never run in CI",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["out", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "PL"]
ignore = [
    "E501",     # 650 legacy long lines (prose, HTML templates); line-length 120 still drives `ruff format` for new files
    "E741",     # short comprehension names (`l`, `O`) are the house style in parsers and report code
    "PLR0917",  # too many positional arguments: internal helpers, signatures are stable
    "PLR2004",  # magic numbers: thresholds and sample sizes are named in the prereg docs, not constants
    "PLR0911",  # many returns, PLR0912, PLR0913, PLR0915: the pipeline functions are long by design
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLC0415",  # imports inside functions are deliberate (lazy sklearn/FastAPI, sys.path set up first)
    "PLW0603",  # module-level state (locks, caches) is intentional
    "PLW2901",  # loop variable reassigned
    "B905",     # zip() without strict=: lengths are equal by construction in these call sites
    "E402",     # scripts put the repo root on sys.path before importing
    "SIM108",   # ternary suggestions reduce readability in the report templates
    "SIM105",   # contextlib.suppress is not clearer than try/except/pass here
    "PLR1702",
    "UP032",    # f-string conversion churn in report templates
]

[tool.ruff.lint.per-file-ignores]
# Exact known synthetic fixture copy; retain its original bytes/provenance.
"test-materials/workdesk/supplied-pipeline/train.py" = ["F401"]
# Legacy modules kept as-is; exempt from linting.
"agent/factorial.py" = ["ALL"]
"agent/factorial_g5.py" = ["ALL"]
"agent/edit_dsl.py" = ["ALL"]
"agent/guard_g9.py" = ["ALL"]
"agent/contract_g9.py" = ["ALL"]
"agent/llm.py" = ["ALL"]
"agent/transport.py" = ["ALL"]
"agent/fidelity.py" = ["ALL"]
"sandbox/executor.py" = ["ALL"]
"sandbox/run.py" = ["ALL"]
"sandbox/run_factorial.py" = ["ALL"]
"sandbox/factorial_stats.py" = ["ALL"]
"baselines/rulefix.py" = ["ALL"]