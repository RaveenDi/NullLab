# NullLab leakage audit. DEFAULT = rules only: no model, no secrets, $0.
# Fails the job (exit 1) when a case's evaluation is inflated beyond the threshold with the 95% interval above 0.
# A "case" is a folder holding train.py + data.csv (see docs/PRODUCT-FEATURES.md). Set AUDIT_PATH to your case folder or a tree of them.
#
# OPTIONAL Spark mode (asks the Meta model about cases the rules cannot judge) is NOT enabled here. To use it you would add a repository
# secret MODEL_API_KEY and run `python -m agent.ci_check <path> --spark --live` yourself; it also goes through agent/llm.py's spend gate,
# which expects the owner's battle-station tooling, so it is UNVERIFIED on a stock GitHub runner. Rules-only needs none of that.
name: nulllab-audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      path:
        description: "Case folder (or tree of case folders) to audit"
        required: false
        default: "corpus/clean_control"
      threshold:
        description: "Max tolerated inflation (0.05 = 5 pp accuracy, 0.05 PR-AUC units)"
        required: false
        default: "0.05"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NULLLAB_NO_DOCKER: "1"      # the runner is already an ephemeral sandbox; the audit's own restricted subprocess is still used
      AUDIT_PATH: ${{ github.event.inputs.path || 'corpus/clean_control' }}
      AUDIT_THRESHOLD: ${{ github.event.inputs.threshold || '0.05' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Audit (rules only, $0)
        run: python -m agent.ci_check "$AUDIT_PATH" --threshold "$AUDIT_THRESHOLD" --summary "$GITHUB_STEP_SUMMARY"
