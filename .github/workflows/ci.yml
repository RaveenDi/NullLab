# NullLab CI: lint and offline tests. No secrets, no model calls, no spend.
# Tests marked `slow` (over 60 s) and `live` (real API calls) are deselected here.
# Runs on GitHub; historical missing-data checks can skip in fresh checkouts.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NULLLAB_NO_DOCKER: "1"   # the runner is already an ephemeral sandbox; the restricted subprocess is still used
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: python scripts/freeze_check.py verify --allow-missing-data
      - run: pytest -m "not slow and not live" -q
